<script>(()=>{

const CS=getComputedStyle(document.documentElement),V=k=>CS.getPropertyValue(k).trim();

/* ---------- 数据 ---------- */

["第2章 编程基础",["变量与数据类型","POU 程序组织单元","函数与功能块"]],
["第3章 工程结构",["任务配置与调度","库管理与引用","设备树与硬件组态"]],

["第5章 可视化",["可视化界面开发","报警与日志系统","配方与趋势图"]],

const FL='<g style="fill:var(--bl)"><circle cx="40" cy="20" r="16"/><circle cx="60" cy="40" r="16"/><circle cx="40" cy="60" r="16"/><circle cx="20" cy="40" r="16"/><circle cx="40" cy="40" r="18"/></g>';
const AS='<g style="fill:var(--bl)"><rect x="34" y="4" width="12" height="72" rx="6"/><rect x="34" y="4" width="12" height="72" rx="6" transform="rotate(60 40 40)"/><rect x="34" y="4" width="12" height="72" rx="6" transform="rotate(120 40 40)"/></g>';

let MODELS=[{n:"主力·GLM",m:"glm-4.7"},{n:"校对·GPT",m:"gpt-5.2"},{n:"快速·Haiku",m:"haiku-4.5"},{n:"备用·主Key",m:"deepseek-v3.2"}];

["ok ok ok","ok run wait","ok ok fail","run wait wait","wait wait wait","wait wait wait"].forEach((s,i)=>ST[i]=s.split(" "));

/* ---------- Agent ---------- */
function addAgent(o={}){
  const id=++seq;
  const a={id,nm:o.nm||String.fromCharCode(64+id),model:o.model||MODELS[0].m,prompt:o.prompt||"",mats:o.mats||[],color:o.color||COLORS[(id-1)%COLORS.length],blob:BLOBS[(id-1)%BLOBS.length],wAdj:0};
  agents.push(a);return a;
}
addAgent({nm:"入门章节专员",model:"glm-4.7"});owner[0]=1;owner[1]=1;
addAgent({nm:"B",model:"gpt-5.2"});owner[2]=2;owner[3]=2;

const byId=id=>agents.find(a=>a.id===id);
function groups(){
  const gs=[];let cur=null;
  for(let i=0;i<CH.length;i++){
    const o=owner[i];
    if(!cur||cur.o!==o){cur={o,ch:[]};gs.push(cur);}
    cur.ch.push(i);
  }
  return gs;
}
const grpOf=a=>groups().find(g=>g.o===a.id);
const rangeLabel=ch=>ch.length===1?`第${ch[0]+1}章`:`第${ch[0]+1}–${ch[ch.length-1]+1}章`;
const nodeTotal=ch=>ch.reduce((s,i)=>s+CH[i][1].length,0);

/* ---------- 布局 ---------- */
function layout(){
  let y=28;P=[];F=[];
  groups().forEach(g=>{
    const a=g.o?byId(g.o):null;
    if(a)y+=G.HD;
    const t0=y;
    g.ch.forEach((i,k)=>{
      const h=CH[i][1].length*(G.SH+G.SG)-G.SG;
      P[i]={t:y,h,c:y+h/2};
      y+=h+(k<g.ch.length-1?G.CHGAP:0);
    });
    if(a){F.push({a,t:t0-G.HD,h:y+G.FT-t0+G.HD});y+=G.FT;}
    y+=G.GAP;
  });
  WH=y-12;WW=G.SX+G.SW+36;
  const cy=P.map(p=>p.c);
  RY=(Math.min(...cy)+Math.max(...cy))/2-G.RH/2;
}

/* ---------- 渲染 ---------- */
function render(){
  layout();
  const W=$("#world"),STG=$("#stage");
  let h="";
  h+=`<div class="root" style="left:${G.RX}px;top:${RY}px;width:${G.RW}px;height:${G.RH}px"><b>CODESYS 手册</b><span>${CH.length} 章，${CH.reduce((n,c)=>n+c[1].length,0)} 个节点</span></div>`;
  F.forEach((f,k)=>{
    const a=f.a,g=grpOf(a);if(!g)return;
    const n=nodeTotal(g.ch),d=g.ch.reduce((s,i)=>s+ST[i].filter(x=>x==="ok").length,0);
    const w=G.SX+G.SW-G.CX+36+(a.wAdj||0);
    h+=`<div class="agent" data-id="${a.id}" style="left:${G.CX-18}px;top:${f.t}px;width:${w}px;height:${f.h}px;--c:${a.color};--bl:${a.blob}">
      <div class="ah"><span class="sc">${rangeLabel(g.ch)}</span><b>${esc(a.nm)}</b><i class="md">${esc(a.model)}</i>
      <span class="ac"><button class="cfgb" data-cfg="${a.id}">⚙ 配置</button><button class="del" data-del="${a.id}" title="删除 Agent" aria-label="删除">×</button></span></div>
      <div class="af"><span class="nt">${n} 个节点</span><span class="pb"><i style="width:${n?d/n*100:0}%"></i></span><span class="cnt">${d}/${n} 完成</span></div>
      <span class="rhr"></span><span class="rhb"></span>
      <span class="grip"></span><span class="blob"><svg viewBox="0 0 80 80" aria-hidden="true">${k%2?AS:FL}</svg></span>
    </div>`;
  });
  CH.forEach(([t,secs],i)=>{
    const p=P[i],o=owner[i],ag=o?byId(o):null;
    h+=`<div class="chap${ag?"":" free"}" id="ch-${i}" style="left:${G.CX}px;top:${p.c-G.CHH/2}px;width:${G.CHW}px;height:${G.CHH}px"><b>${esc(t)}</b><span>${secs.length} 个节点${ag?"":"，未分配"}</span></div>`;
    secs.forEach((n,j)=>{
      const st=ST[i][j];
      h+=`<div class="sec ${st}" id="sec-${i}-${j}" style="left:${G.SX}px;top:${p.t+j*(G.SH+G.SG)}px;width:${G.SW}px;height:${G.SH}px"><span class="t">${esc(n)}</span><em>${o?LB[st]:"○ 未分配"}</em></div>`;
    });
  });
  let e="";
  const cv=(x0,y0,x1,y1)=>{const m=(x1-x0)*.5;return `<path d="M${x0} ${y0}C${x0+m} ${y0} ${x1-m} ${y1} ${x1} ${y1}" stroke="${V("--edge")}" stroke-width="1.6"/>`;};
  CH.forEach((c,i)=>{const p=P[i];e+=cv(G.RX+G.RW,RY+G.RH/2,G.CX,p.c);c[1].forEach((_,j)=>e+=cv(G.CX+G.CHW,p.c,G.SX,p.t+j*(G.SH+G.SG)+G.SH/2));});
  W.innerHTML=`<svg id="edges" width="${WW}" height="${WH}" style="width:${WW}px;height:${WH}px">${e}</svg>`+h;
  W.style.width=WW+"px";W.style.height=WH+"px";
  STG.style.width=WW*scale+"px";STG.style.height=WH*scale+"px";
  W.style.transform=`scale(${scale})`;
  bind();
  refreshStats();
}

/* ---------- 统计 ---------- */
function refreshStats(){
  let ok=0,run=0,fail=0,wait=0;
  ST.forEach((row,i)=>{ if(!owner[i])return;
    row.forEach(s=>{ if(s==="ok")ok++; else if(s==="run")run++; else if(s==="fail")fail++; else wait++; }); });
  $("#lg-ok").textContent=`已完成 ${ok}`;
  $("#lg-run").textContent=`生成中 ${run}`;
  $("#lg-fail").textContent=`失败 ${fail}`;
  $("#lg-wait").textContent=`排队 ${wait}`;
  const act=agents.filter(a=>grpOf(a)).length;
  const total=ST.flat().length;
  $("#sub").textContent=`${act} 个 Agent 正在并行生成，已完成 ${ok} / ${total} 个节点`;
}
function refreshCard(a){
  const g=grpOf(a);if(!g)return;
  const el=$(`.agent[data-id="${a.id}"]`);if(!el)return;
  const n=nodeTotal(g.ch),d=g.ch.reduce((s,i)=>s+ST[i].filter(x=>x==="ok").length,0);
  el.querySelector(".nt").textContent=n+" 个节点";
  el.querySelector(".pb i").style.width=(n?d/n*100:0)+"%";
  el.querySelector(".cnt").textContent=`${d}/${n} 完成`;
}
function setSec(i,j,st){
  ST[i][j]=st;
  const el=$(`#sec-${i}-${j}`);if(!el)return;
  el.className="sec "+st;
  el.querySelector("em").textContent=LB[st];
}

/* ---------- 视图 ---------- */
function setS(s){
  scale=Math.max(.4,Math.min(1.6,s));
  const W=$("#world"),STG=$("#stage");
  W.style.transform=`scale(${scale})`;
  STG.style.width=WW*scale+"px";STG.style.height=WH*scale+"px";
  $("#zoom").value=Math.round(scale*100);$("#zl").textContent=Math.round(scale*100)+"%";
}
const fit=()=>{const vp=$("#vp");setS(Math.min(1,(vp.clientHeight-50)/WH,(vp.clientWidth-60)/WW));};
$("#fit").onclick=fit;
$("#zoom").oninput=e=>setS(e.target.value/100);
function toWorld(cx,cy){const r=$("#world").getBoundingClientRect();return{x:(cx-r.left)/scale,y:(cy-r.top)/scale};}

/* ---------- 事件绑定 ---------- */
function bind(){
  $$(".cfgb").forEach(b=>b.onclick=e=>{e.stopPropagation();openCfg(+b.dataset.cfg);});
  $$(".del").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const a=byId(+b.dataset.del);if(!a)return;
    owner=owner.map(o=>o===a.id?null:o);
    agents=agents.filter(x=>x.id!==a.id);
    render();
    toast(`已删除 ${a.nm}，其章节回到未分配`);
  });
  $$(".rhb").forEach(el=>el.addEventListener("pointerdown",e=>startResize(e,el.closest(".agent"))));
  $$(".rhr").forEach(el=>el.addEventListener("pointerdown",e=>startWiden(e,el.closest(".agent"))));
}

/* 底缘：按章节增减范围（只能吃未分配章节） */
function startResize(e,cardEl){
  e.preventDefault();e.stopPropagation();
  const a=byId(+cardEl.dataset.id);if(!a)return;
  const g=grpOf(a);if(!g)return;
  const s0=g.ch[0];
  const avail=[];
  for(let i=s0;i<CH.length;i++){ if(owner[i]&&owner[i]!==a.id)break; avail.push(i); }
  let newEnd=g.ch[g.ch.length-1];
  cardEl.classList.add("dragging","resizing");
  document.body.style.userSelect="none";
  const move=ev=>{
    const p=toWorld(ev.clientX,ev.clientY);
    let end=s0;
    avail.forEach(i=>{ if(p.y>=P[i].t+P[i].h-14) end=i; });
    newEnd=end;
    avail.forEach(i=>{
      const el=$(`#ch-${i}`);if(!el)return;
      el.classList.toggle("preview",i<=end);
      el.classList.toggle("dim",i>end);
    });
  };
  const up=()=>{
    window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
    document.body.style.userSelect="";
    cardEl.classList.remove("dragging","resizing");
    avail.forEach(i=>{const el=$(`#ch-${i}`);el&&el.classList.remove("preview","dim");});
    setRange(a,s0,newEnd);
    toast(`${a.nm}：${rangeLabel([s0,newEnd].length?Array.from({length:newEnd-s0+1},(_,k)=>s0+k):[])} · ${nodeTotal(Array.from({length:newEnd-s0+1},(_,k)=>s0+k))} 个节点`);
  };
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
}
function setRange(a,s,eIdx){
  owner.forEach((o,i)=>{if(o===a.id)owner[i]=null;});
  for(let i=s;i<=eIdx;i++)owner[i]=a.id;
  render();
}

/* 右缘：只调卡片宽度，不改管辖 */
function startWiden(e,cardEl){
  e.preventDefault();e.stopPropagation();
  const a=byId(+cardEl.dataset.id);if(!a)return;
  const w0=a.wAdj||0,x0=e.clientX;
  cardEl.classList.add("dragging","resizing");
  document.body.style.userSelect="none";
  const move=ev=>{
    a.wAdj=Math.max(-120,Math.min(420,w0+(ev.clientX-x0)/scale));
    cardEl.style.width=(G.SX+G.SW-G.CX+36+a.wAdj)+"px";
  };
  const up=()=>{
    window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
    document.body.style.userSelect="";
    cardEl.classList.remove("dragging","resizing");
    WW=Math.max(G.SX+G.SW+36, ...agents.map(x=>G.SX+G.SW-G.CX+36+(x.wAdj||0)+G.CX-18+24));
    $("#world").style.width=WW+"px";
    const stg=$("#stage");stg.style.width=WW*scale+"px";
  };
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
}

/* ---------- 配置面板 ---------- */
function fillModels(sel){
  $("#md").innerHTML=MODELS.map((m,i)=>`<option value="${m.m}"${i===sel?" selected":""}>${esc(m.n)}（${esc(m.m)}）</option>`).join("");
}
function fillReuse(){
  const cur=$("#ru").value;
  $("#ru").innerHTML=`<option value="">不复用，从零配置</option>`+agents.filter(a=>a.id!==editingId).map(a=>`<option value="${a.id}">${esc(a.nm)}</option>`).join("");
  $("#ru").value=cur||"";
}
function setColor(c){
  formColor=c;
  const idx=COLORS.findIndex(x=>x.toLowerCase()===c.toLowerCase());
  $$("#swrow button").forEach(b=>b.classList.toggle("on",+b.dataset.c-1===idx));
  if(idx<0)$$("#swrow button").forEach(b=>b.classList.remove("on"));
  $("#cc").value=/^#[0-9a-f]{6}$/i.test(c)?c:"#2fd884";
}
function renderMats(){
  const box=$("#mats");
  box.querySelectorAll(".chip").forEach(c=>c.remove());
  const html=formMats.map((m,i)=>`<span class="chip${m.dir?" dir":""}">${m.icon||"📎"} ${esc(m.name)} <button data-rm="${i}">×</button></span>`).join("");
  box.insertAdjacentHTML("afterbegin",html);
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{formMats.splice(+b.dataset.rm,1);renderMats();});
  $("#addmat").textContent=(formMats.length?"添加素材 ▾":"添加素材 ▾");
}
function openCfg(id){
  editingId=id||null;
  const a=id?byId(id):null;
  $("#ct").textContent=a?"配置":"新增";
  $("#cp").textContent=a?`正在配置：${a.nm}`:"框住的章节就是这个 Agent 的职责范围";
  $("#nm").value=a?a.nm:"";
  fillModels(a?Math.max(0,MODELS.findIndex(m=>m.m===a.model)):0);
  $("#pr").value=a?a.prompt:"";
  formMats=a?[...a.mats]:[];
  setColor(a?a.color:COLORS[agents.length%COLORS.length]);
  fillReuse();
  renderMats();
  $("#cfg").classList.add("show");
  setTimeout(()=>$("#nm").focus(),60);
}
$("#cx").onclick=$("#cancel").onclick=()=>$("#cfg").classList.remove("show");
$("#add").onclick=()=>openCfg(null);
$$("#swrow button").forEach(b=>b.onclick=()=>setColor(COLORS[+b.dataset.c-1]));
$("#cc").oninput=e=>setColor(e.target.value);
$("#ru").onchange=e=>{
  const a=byId(+e.target.value);if(!a)return;
  $("#md").value=a.model;$("#pr").value=a.prompt;formMats=[...a.mats];setColor(a.color);renderMats();
  $("#nm").value=a.nm+" 副本";
  toast(`已复用 ${a.nm} 的配置`);
};
$("#newarch").onclick=()=>{$("#arch").classList.add("show");$("#archnew").focus();};
$("#archnew").onkeydown=e=>{if(e.key==="Enter")$("#archadd").click();};
$("#archadd").onclick=()=>{
  const v=$("#archnew").value.trim();if(!v)return;
  MODELS.push({n:v,m:v.toLowerCase().replace(/\s+/g,"-")});
  $("#archnew").value="";renderArch();fillModels(MODELS.length-1);
  $("#archn").textContent=MODELS.length;
  toast("已新建档案 "+v);
};
function renderArch(){
  $("#archlist").innerHTML=MODELS.map((m,i)=>`<div class="row"><b>${esc(m.n)}</b><span>${esc(m.m)}</span></div>`).join("");
  $("#archn").textContent=MODELS.length;
}
$("#archbtn").onclick=e=>{
  e.stopPropagation();
  const r=$("#archbtn").getBoundingClientRect(),a=$("#arch");
  a.style.left=Math.max(12,Math.min(innerWidth-336,r.right-320))+"px";
  a.style.top=(r.bottom+8)+"px";
  a.classList.toggle("show");
  renderArch();
};
document.addEventListener("click",e=>{
  if(!e.target.closest("#arch")&&!e.target.closest("#archbtn"))$("#arch").classList.remove("show");
  if(!e.target.closest("#matmenu")&&!e.target.closest("#addmat"))$("#matmenu").classList.remove("show");
  if(!e.target.closest("#newarch")&&!e.target.closest("#arch"))$("#arch").classList.remove("show");
});

/* 素材 */
$("#addmat").onclick=e=>{
  e.stopPropagation();
  const r=$("#addmat").getBoundingClientRect();
  const m=$("#matmenu");m.style.left=Math.min(r.left,innerWidth-210)+"px";m.style.top=(r.bottom+6)+"px";
  m.classList.add("show");
};
$$("#matmenu button").forEach(b=>b.onclick=()=>{
  $("#matmenu").classList.remove("show");
  const t=b.dataset.m;
  if(t==="file")$("#filein").click();
  if(t==="dir")$("#dirin").click();
  if(t==="text"){
    const v=prompt("粘贴素材文本（会作为一份素材记入）：");
    if(v&&v.trim()){formMats.push({icon:"📋",name:v.trim().slice(0,18)+(v.trim().length>18?"…":"")+`（${v.trim().length}字）`});renderMats();}
  }
});
$("#filein").onchange=e=>{
  [...e.target.files].forEach(f=>formMats.push({icon:"📎",name:f.name}));
  renderMats();e.target.value="";
};
$("#dirin").onchange=e=>{
  const fs=[...e.target.files];
  if(!fs.length)return;
  const root=fs[0].webkitRelativePath.split("/")[0];
  const ok=fs.filter(f=>/\.(md|txt|docx?|pdf|html?)$/i.test(f.name));
  ok.slice(0,50).forEach(f=>formMats.push({icon:"📁",name:f.webkitRelativePath.replace(root+"/",""),dir:true}));
  renderMats();
  toast(`已读取目录「${root}」，加入 ${Math.min(ok.length,50)} 个文件`);
  e.target.value="";
};

/* 创建 / 保存 */
$("#create").onclick=()=>{
  const nm=$("#nm").value.trim(),model=$("#md").value,prompt=$("#pr").value.trim();
  if(editingId){
    const a=byId(editingId);if(!a)return;
    a.nm=nm||a.nm;a.model=model;a.prompt=prompt;a.mats=[...formMats];a.color=formColor;
    $("#cfg").classList.remove("show");render();toast("已更新 "+a.nm);return;
  }
  let s=-1;
  for(let i=0;i<CH.length;i++){ if(!owner[i]){s=i;break;} }
  if(s<0){toast("所有章节都已分配，请先缩小其他 Agent 的范围");return;}
  const a=addAgent({nm,model,prompt,mats:[...formMats],color:formColor});
  owner[s]=a.id;
  $("#cfg").classList.remove("show");render();
  toast(`已创建 ${a.nm}，默认管辖第 ${s+1} 章；拖底缘可扩框`);
};

/* ---------- 批量生成 ---------- */
$("#go").onclick=()=>{ playing?stopRun():startRun(); };
function startRun(){
  if(!agents.length){toast("先新增一个 Agent 再开始生成");return;}
  playing=true;timers.forEach(clearTimeout);timers=[];
  ST=CH.map(c=>c[1].map(()=>"wait"));
  render();
  const btn=$("#go");btn.classList.add("running");btn.innerHTML='取消批次<i class="ci">■</i>';
  const cohorts=agents.map(a=>{const g=grpOf(a);if(!g)return null;
    const list=[];g.ch.forEach(i=>CH[i][1].forEach((_,j)=>list.push({i,j,a})));return {a,list,k:0};}).filter(Boolean);
  let pending=0;
  const pump=()=>{
    if(!playing)return;
    let active=false;
    cohorts.forEach(c=>{
      if(c.k>=c.list.length)return;
      active=true;
      const job=c.list[c.k++];pending++;
      setSec(job.i,job.j,"run");refreshCard(job.a);
      const t=setTimeout(()=>{
        if(!playing)return;
        pending--;
        setSec(job.i,job.j,Math.random()<.07?"fail":"ok");
        refreshCard(job.a);refreshStats();
        if(pending===0&&cohorts.every(x=>x.k>=x.list.length))finish();
      },760+Math.random()*820);
      timers.push(t);
    });
    if(!active&&pending===0)finish();
  };
  timers.push(setInterval(pump,360));
  pump();
}
function finish(){
  playing=false;
  timers.forEach(t=>{clearInterval(t);clearTimeout(t);});timers=[];
  const btn=$("#go");btn.classList.remove("running");btn.innerHTML='重新生成<i class="ci">↻</i>';
  refreshStats();toast("本批次生成完成");
}
function stopRun(){
  playing=false;
  timers.forEach(t=>{clearInterval(t);clearTimeout(t);});timers=[];
  const btn=$("#go");btn.classList.remove("running");btn.innerHTML='批量生成 Topic<i class="ci">▶</i>';
  ST=ST.map(r=>r.map(x=>x==="run"?"wait":x));
  render();
}

/* ---------- 启动 ---------- */
render();setS(1);fillModels(0);renderArch();renderMats();
})();
</script></body></html>
